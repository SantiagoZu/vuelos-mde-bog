name: Rastrear vuelos MDE-BOG

on:
  schedule:
    # 2 veces al día (hora Colombia ≈ 6:41 a.m. y 6:41 p.m.). GitHub usa UTC.
    - cron: "41 11 * * *"
    - cron: "41 23 * * *"
  workflow_dispatch:
    inputs:
      force_serpapi:
        description: "Consultar agencias (SerpApi) aunque ya se haya hecho hoy"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tracker/**", "config.yaml", "tests/**", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  rastrear:
    needs: tests
    # En un push solo se corren los tests; la consulta real va por cron o manual.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Consultar precios
        id: run
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m tracker.main run ${{ inputs.force_serpapi && '--force-serpapi' || '' }}

      - name: Subir HTML de diagnóstico (si algo no se pudo leer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar histórico y reporte en el repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json reports/
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "datos: precios $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
