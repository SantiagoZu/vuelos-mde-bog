# ============================================================
#  Configuración del tracker de vuelos Medellín ⇄ Bogotá
#  Cambia lo que necesites aquí; el código no tiene nada "quemado".
# ============================================================

viaje:
  # Pasajeros adultos. Google Flights devuelve el precio TOTAL para todos,
  # así que con 1 adulto ves el precio por persona.
  adultos: 1
  moneda: COP
  idioma: es-419
  solo_directos: true          # MDE-BOG es ruta directa; evita itinerarios raros con escala

  tramos:
    - nombre: ida
      fecha: "2027-03-20"
      origenes: [MDE, EOH]     # MDE = José María Córdova (Rionegro), EOH = Olaya Herrera
      destinos: [BOG]
    - nombre: vuelta
      fecha: "2027-03-23"
      origenes: [BOG]
      destinos: [MDE, EOH]

# Franjas horarias según la hora de salida (hora local). [inicio, fin) en horas 0-24.
franjas:
  - { nombre: madrugada, desde: 0,  hasta: 6 }
  - { nombre: manana,    desde: 6,  hasta: 10 }
  - { nombre: mediodia,  desde: 10, hasta: 14 }
  - { nombre: tarde,     desde: 14, hasta: 18 }
  - { nombre: noche,     desde: 18, hasta: 24 }

fuentes:
  # Google Flights (gratis, sin API key). Trae precios publicados por las
  # aerolíneas: Avianca, LATAM, JetSMART, Wingo, Clic (si Google la indexa)...
  google_flights:
    habilitada: true

  # SerpApi (opcional). Añade los precios de agencias/OTAs (Despegar, Expedia,
  # Kiwi, etc.) vía "booking options". Requiere el secret SERPAPI_KEY.
  # Plan gratis: 250 búsquedas/mes -> por eso corre máximo 1 vez al día.
  serpapi:
    habilitada: true
    max_ejecuciones_por_dia: 1
    # Cuántos vuelos (los más baratos de cada tramo) se consultan en detalle
    # para ver qué vendedores los ofrecen. Cada uno = 1 búsqueda.
    booking_options_top_n: 2

alertas:
  canales:
    # Abre un issue en el repo y te menciona: GitHub te manda correo y notificación
    # en la app móvil. No requiere configurar nada.
    github_issue: true
    # Opcional: secrets TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID.
    telegram: true

  # Cuándo se considera una bajada "significativa". Pon null para desactivar una regla.
  # Todas se evalúan sobre el viaje completo (ida más barata + vuelta más barata),
  # salvo caida_pct_franja, que mira cada franja horaria por separado.
  reglas:
    nuevo_minimo_historico: true     # el viaje completo marca el precio más bajo visto hasta ahora
    caida_pct_vs_anterior: 10        # baja ≥ 10 % frente a la consulta anterior
    caida_pct_vs_promedio_7d: 12     # queda ≥ 12 % por debajo del promedio de los últimos 7 días
    # Referencia: en Black Week/Black Friday del año pasado esta ruta se compró entre
    # $80.000 y $100.000 por trayecto. Hoy (nov-2026) está en ~$153.000-$159.000 por trayecto.
    precio_objetivo: 200000          # ida+vuelta en o por debajo de esto
    precio_objetivo_tramo: 100000    # un solo trayecto (ida o vuelta) en o por debajo de esto
    caida_pct_franja: 20             # una franja (ida o vuelta) baja ≥ 20 % vs la consulta anterior

  # Anti-spam: una misma regla no vuelve a avisar en este tiempo,
  # salvo que el precio quede todavía más bajo que en el último aviso.
  enfriamiento_horas: 24

# Después de esta fecha el pipeline deja de consultar (ya no tiene sentido).
dejar_de_rastrear_despues_de: "2027-03-20"
